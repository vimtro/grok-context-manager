name: Bug report
description: Report a reproducible problem using synthetic data only
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Never paste real Grok Bot chats, secrets, API tokens, private file paths, or billing account identifiers into a public issue. Use synthetic examples.
        For security vulnerabilities, follow SECURITY.md and report privately.
  - type: input
    id: version
    attributes:
      label: GCM version or commit
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and redact any private identifiers
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Safety checklist
      options:
        - label: I removed credentials, personal information, and real conversation content
          required: true
        - label: This is not a private security vulnerability report
          required: true
