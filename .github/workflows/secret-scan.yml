name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full Git history (sanitized findings only)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gcm-scan"
          status=0
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/gcm-scan:/reports" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --no-banner --redact --log-opts="--all" \
            --report-format json --report-path /reports/history.json /repo || status=$?
          if [ -s "$RUNNER_TEMP/gcm-scan/history.json" ]; then
            echo "Potential finding rule/path/commit (never reveal secret text):"
            jq -r '.[] | [.RuleID, .File, .Commit] | join(" | ")' "$RUNNER_TEMP/gcm-scan/history.json" | sort -u
          fi
          exit "$status"

      - name: Scan current files (sanitized findings only)
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gcm-scan"
          status=0
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/gcm-scan:/reports" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            dir --no-banner --redact \
            --report-format json --report-path /reports/current.json /repo || status=$?
          if [ -s "$RUNNER_TEMP/gcm-scan/current.json" ]; then
            echo "Potential finding rule/path (never reveal secret text):"
            jq -r '.[] | [.RuleID, .File] | join(" | ")' "$RUNNER_TEMP/gcm-scan/current.json" | sort -u
          fi
          exit "$status"
