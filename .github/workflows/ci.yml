name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
        if: runner.os == 'Windows'
      - run: pnpm test:e2e
      - name: Clean-install smoke test (pack + npm install -g)
        run: pnpm smoke
        if: matrix.node == 22

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t grok-context-manager:ci .
      - name: Container smoke test
        run: |
          docker volume create gcm-ci
          docker run --rm -v gcm-ci:/data grok-context-manager:ci bots add sales --name Sales
          docker run --rm -v gcm-ci:/data grok-context-manager:ci mcp token create --name ci --bots sales
          cid=$(docker run -d --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:18787:8787 -v gcm-ci:/data grok-context-manager:ci)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18787/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18787/mcp -H 'content-type: application/json' -d '{}')" = "401"
          docker rm -f "$cid"
